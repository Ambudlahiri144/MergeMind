# Lint, types, unit, integration and E2E on every push to main and every pull request (ADR-034).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  integration:
    name: Integration tests (Mongo + Redis containers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:int

  image:
    name: Backend image builds (api, worker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # The production image (Deploy.md); the VM builds the same Dockerfile on arm64.
      - run: docker build --target api -t mergemind-api:ci .
      - run: docker build --target worker -t mergemind-worker:ci .
      # The default target: api + worker + Redis in one container (Render, ADR-038).
      - run: docker build -t mergemind-render:ci .
      # Import every compiled module (except the two entrypoints) inside the production image,
      # so a dependency missing from the image fails here, not on the server.
      - name: Every api and worker module resolves in the image
        run: >-
          docker run --rm mergemind-render:ci node -e "
          const fs=require('fs'),path=require('path');
          const files=['apps/api/dist','apps/worker/dist'].flatMap(d=>fs.readdirSync(d,{recursive:true}).filter(f=>f.endsWith('.js')).map(f=>path.resolve(d,f)));
          const skip=/[\/](server|main)\.js$/;
          Promise.all(files.filter(f=>!skip.test(f)).map(f=>import(f))).then(m=>console.log('resolved',m.length,'modules'),e=>{console.error(e);process.exit(1)})"

  e2e:
    name: E2E + accessibility (Playwright, axe)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx -w @mergemind/web playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
