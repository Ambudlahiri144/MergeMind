# Production backend on one VM (Deploy.md, ADR-037). Run from the repo root on the VM:
#   docker compose -f deploy/compose.prod.yml --env-file .env.production up -d --build
# (deploy/deploy.sh does this.) Only Caddy publishes ports; everything else is internal.
# MongoDB is the Atlas cluster in MONGODB_URI. The web app runs on Vercel and calls the api
# through Caddy over HTTPS.
name: mergemind-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  api:
    build:
      context: ..
      target: api
    env_file: ../.env.production
    environment:
      NODE_ENV: production
      API_PORT: '4000'
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  worker:
    build:
      context: ..
      target: worker
    env_file: ../.env.production
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    # In-flight jobs get time to finish; a review cut off here is retried by BullMQ (ADR-018).
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *logging

  redis:
    # BullMQ requires noeviction so queued jobs are never dropped (ADR-005). Same major as dev and CI.
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *logging

  ollama:
    # Embeddings only (nomic-embed-text): code context never leaves the server (ADR-037).
    image: ollama/ollama:0.40.0
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
    logging: *logging

  caddy:
    image: caddy:2.11-alpine
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env.production}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    restart: unless-stopped
    logging: *logging

volumes:
  redis-data:
  ollama-models:
  caddy-data:
  caddy-config:
